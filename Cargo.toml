[package]
name = "rustvecdb"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A persistent vector database in Rust with HNSW graph indexing, SQ8 scalar quantization, metadata filtering, and WAL durability"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crc32fast = "1.4"

[dev-dependencies]
tempfile = "3.10"
criterion = "0.5"

[[bench]]
name = "vecdb_bench"
harness = false
